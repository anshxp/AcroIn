version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '04:15'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: pip
    directory: /face_rec_service
    schedule:
      interval: weekly
      day: monday
      time: '04:45'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10

  - package-ecosystem: pip
    directory: /recomendation system
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
