name: Refresh mobile lockfile once

on:
  push:
    branches: [production/complete-hardening]
    paths:
      - 'mobile/package.json'
      - '.github/workflows/refresh-mobile-lock-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Regenerate mobile lockfile
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps
      - name: Verify clean install
        working-directory: mobile
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Verify production dependency audit
        working-directory: mobile
        run: npm audit --omit=dev --audit-level=high
      - name: Remove one-time workflow and commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/refresh-mobile-lock-once.yml
          git add mobile/package-lock.json .github/workflows/refresh-mobile-lock-once.yml
          git commit -m 'chore(mobile): refresh lockfile after dependency hardening [skip ci]'
          git push origin HEAD:production/complete-hardening
