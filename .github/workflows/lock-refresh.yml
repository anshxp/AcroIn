name: Refresh dependency locks

on:
  push:
    branches: [production/complete-hardening]
    paths:
      - 'mobile/package.json'
      - '.github/workflows/lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-mobile-lock:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps
      - name: Commit lockfile
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- mobile/package-lock.json; then
            echo 'Lockfile already synchronized.'
            exit 0
          fi
          git add mobile/package-lock.json
          git commit -m 'chore(mobile): synchronize dependency lockfile [skip ci]'
          git push origin HEAD:production/complete-hardening
