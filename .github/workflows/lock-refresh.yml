name: Refresh backend lockfile

on:
  push:
    branches: [tmp/lock-refresh-v3]
    paths:
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - '.github/workflows/lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/package-lock.json
          git commit -m 'chore(backend): synchronize dependency lockfile [skip ci]'
          git push origin HEAD:tmp/lock-refresh-v3
