name: AcroIn Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit backend dependencies
        working-directory: backend
        run: npm install --ignore-scripts && npm audit --omit=dev --audit-level=high
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm install --ignore-scripts && npm audit --omit=dev --audit-level=high
      - name: Audit mobile dependencies
        working-directory: mobile
        run: npm install --ignore-scripts && npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Python services
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r 'face_rec_service/requirements.txt'
          pip-audit -r 'recomendation system/requirements.txt'
